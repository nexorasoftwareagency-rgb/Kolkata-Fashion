kind = "web"
previewPath = "/"
title = "Kolkata Fashion Parsa"
version = "1.0.0"
id = "artifacts/kolkata-fashion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19489

[services.development]
run = "pnpm --filter @workspace/kolkata-fashion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kolkata-fashion", "run", "build" ]
publicDir = "artifacts/kolkata-fashion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19489"
BASE_PATH = "/"
